[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astropype"
version = "0.0.1"
description = "A Python package for astropype."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "jnpippert", email = "pippertjanniklas@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/jnpippert/astropype"
Issues = "https://github.com/jnpippert/astropype/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astropype = ["py.typed"]
